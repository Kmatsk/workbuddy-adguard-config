  - ""
  - '! ===== 原有自定义 ====='
  - '||tanx.com^'
  - '||sax.sina.com.cn^'
  - ""
  - '! ===== 电视/机顶盒 广告补充（2026-11-10 开机日志实测）====='
  - '! 说明：仅收录「公网可解析」的真实广告域名。'
  - '! 海尔 tvad/ad/ads.haier.com、ads.mgtv、ads.cibntv、ads.gitv 等 30+ 个均为空壳域名'
  - '! （电视开机时批量探测，公网 NXDOMAIN），拦截无实际效果，故不收录。'
  - '! 爱奇艺 广告（ad.iqiyi.com 存活）'
  - '||ad.iqiyi.com^'
  - '! 电视家 / 影视仓 类 TVBox 应用广告'
  - '||ad.dianshijia.com^'
  - '||ads.dianshijia.com^'
  - '! TCL 广告位（通用广告池）'
  - '||ads.tcl.com^'
  - '! 凤凰网 广告位'
  - '||ad.ifeng.com^'
  - '! 快手 埋点上报（手机端流量监控）'
  - '||traffic-monitor.yximgs.com^'
  - ""
  - '! ===== 未成年人保护补充（2026-11-10）====='
  - '! iOS iCloud 私人中继开启后，DNS 全部转由苹果解析，会绕过本地所有过滤。'
  - '! 中国大陆未开放该服务，但外区 Apple ID / 漫游时可能启用，故按域名预先封堵。'
  - '||mask-api.icloud.com^'
  - '||mask.apple-dns.net^'
  - '! ===== 班级小管家 App 广告 SDK（2026-11-10）====='
  - '! 依据官方《第三方SDK目录》15 个「使用目的：广告」SDK + 当日 DNS 日志实测命中'
  - '! 优量汇/穿山甲/快手/友盟/Funlink/倍孜/亿帆/Octopus/脉盟/优推 主域已被内置列表覆盖，不重复添加'
